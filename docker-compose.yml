version: '3.9'
services:
  api:
    build: .
    container_name: ia_centinell_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app/uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ia_centinell_db
    environment:
      POSTGRES_USER: iacentinell
      POSTGRES_PASSWORD: iac_secure_password
      POSTGRES_DB: iacentinell_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iacentinell -d iacentinell_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
